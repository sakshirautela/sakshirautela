<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#d4d4d8" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGrad)" stroke="#27272a" stroke-width="1.5" />

  <!-- Monogram Initials: SR (Sakshi Rautela) -->
  <text 
    x="30" 
    y="42" 
    font-family="-apple-system, BlinkMacSystemFont, 'Geist', 'Inter', 'JetBrains Mono', 'Segoe UI', Roboto, sans-serif" 
    font-size="27" 
    font-weight="800" 
    letter-spacing="-1.5px" 
    fill="url(#textGrad)" 
    text-anchor="middle"
  >
    SR
  </text>

  <!-- AI / Live Green Pulse Accent Indicator -->
  <circle cx="50" cy="14" r="3.5" fill="#10b981" filter="url(#glow)" />
  <circle cx="50" cy="14" r="2" fill="#34d399" />
</svg>
